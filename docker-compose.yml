version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pipelineiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: pipelineiq
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pipelineiq-api
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres123@db:5432/pipelineiq
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: pipelineiq-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8003
    depends_on:
      - api

volumes:
  pgdata: